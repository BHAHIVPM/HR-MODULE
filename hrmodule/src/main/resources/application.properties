spring.application.name=hrmodule
server.port=${PORT:8080}
# NOTE: no plain spring.datasource.* here on purpose. All datasources (admin/dev/per-tenant)
# are wired manually in DataSourceConfig via database.properties, routed through RoutingDataSource.
# Adding spring.datasource.url here would make Spring Boot autoconfigure a second, competing
# default DataSource bean.
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# CHANGE THESE before anything but local dev - move to env vars / a secrets manager for real deployments.
jwt.token.expire=3600000
jwt.password=${JWT_PASSWORD:ashnetgwi4309jSDGH34SDfsdor39fddeRHEbengelrk1209ndsdjef}
aes.secret.key=${AES_SECRET_KEY:netgwi4309jSDGH34SDfsdor39fddeRHEbengelrk1209ndsdje}
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.springframework.security=TRACE

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.transaction=DEBUG

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true


spring.data.redis.host=redis-12345.c123.ap-south-1-1.ec2.cloud.redislabs.com
spring.data.redis.port=12345
spring.data.redis.username=default
spring.data.redis.password=f7GObtGOim0ThZpJ0oZATm29dKWDjhC3
spring.data.redis.lettuce.pool.max-active=5

spring.kafka.bootstrap-servers=hr-module-project-mbhahivpm-0a54.h.aivencloud.com:13395
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:avnadmin}" password="${KAFKA_PASSWORD}";
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-location=file:${KAFKA_CA_PATH}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# don't let the API hang if Kafka is unreachable
spring.kafka.producer.properties.max.block.ms=3000