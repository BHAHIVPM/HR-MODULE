spring.application.name=hrmodule
server.port=8080

# NOTE: no plain spring.datasource.* here on purpose. All datasources (admin/dev/per-tenant)
# are wired manually in DataSourceConfig via database.properties, routed through RoutingDataSource.
# Adding spring.datasource.url here would make Spring Boot autoconfigure a second, competing
# default DataSource bean.
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# CHANGE THESE before anything but local dev - move to env vars / a secrets manager for real deployments.
jwt.token.expire=3600000
jwt.password=${JWT_PASSWORD}
aes.secret.key=${AES_SECRET_KEY}
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.springframework.security=TRACE

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.transaction=DEBUG

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true