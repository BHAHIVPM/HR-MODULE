# Admin DB - holds the client_domain table (client -> tenant DB connection details).
# ClientRoutingService reads this DB to look up each tenant's own connection.
spring.datasource.jdbc-url=${DB_URL:jdbc:mysql://localhost:3306/hrmodule}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

